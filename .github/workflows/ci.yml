name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.23'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.22', '1.23']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Run tests
      run: go test -race -coverprofile coverage.out -covermode atomic ./...
      


    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt=sarif -out=gosec.sarif ./...
      continue-on-error: true

    - name: Upload Gosec results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('gosec.sarif') != ''
      with:
        sarif_file: gosec.sarif

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
      continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build for multiple platforms
      run: |
        # Linux
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/takwin-linux-amd64 main.go
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/takwin-linux-arm64 main.go
        
        # Windows
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/takwin-windows-amd64.exe main.go
        
        # macOS
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/takwin-darwin-amd64 main.go
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/takwin-darwin-arm64 main.go

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: dist/

  integration-test:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: dist/

    - name: Make binaries executable (Unix)
      if: runner.os != 'Windows'
      run: chmod +x dist/takwin-*

    - name: Install GCC (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y gcc g++

    - name: Install GCC (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install gcc

    - name: Install GCC (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install mingw -y

    - name: Test simple example (Linux)
      if: runner.os == 'Linux'
      run: |
        cd examples/simple
        ../../dist/takwin-linux-amd64 build
        ls -la build/bin/

    - name: Test simple example (macOS)
      if: runner.os == 'macOS'
      run: |
        cd examples/simple
        ../../dist/takwin-darwin-arm64 build
        ls -la build/bin/

    - name: Test simple example (Windows)
      if: runner.os == 'Windows'
      run: |
        cd examples/simple
        ../../dist/takwin-windows-amd64.exe build
        dir build\bin\

    - name: Test complex example (Linux)
      if: runner.os == 'Linux'
      run: |
        cd examples/complex
        ../../dist/takwin-linux-amd64 build -t mathlib
        ../../dist/takwin-linux-amd64 build -t calculator

    - name: Test complex example (macOS)
      if: runner.os == 'macOS'
      run: |
        cd examples/complex
        ../../dist/takwin-darwin-arm64 build -t mathlib
        ../../dist/takwin-darwin-arm64 build -t calculator

    - name: Test complex example (Windows)
      if: runner.os == 'Windows'
      run: |
        cd examples/complex
        ../../dist/takwin-windows-amd64.exe build -t mathlib
        ../../dist/takwin-windows-amd64.exe build -t calculator